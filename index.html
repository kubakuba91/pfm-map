  }
  .pulse-map-legend-swatch {
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    display: block;
  }
  .pulse-map-popup.mapboxgl-popup {
    z-index: 15;
  }

    font-size: 13px;
    font-weight: 600;
    color: #1f2733;
    padding: 8px 12px;
    border-radius: 4px;
  }
  .pulse-marker {
    width: 24px;
    height: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pulse-marker svg {
    width: 100%;
    height: 100%;
    display: block;

  .pulse-marker.hq-marker {

    height: 30px;

  // Every US state is highlighted except Montana (30) and North Dakota (38).
  var SERVICE_AREA_STATE_FIPS = [
    1, 2, 4, 5, 6, 8, 9, 10, 12, 13, 15, 16, 17, 18, 19, 20, 21, 22, 23,

  ];

  var serviceAreaFips = SERVICE_AREA_STATE_FIPS.reduce(function (acc, fips) {
    acc[fips] = true;
    return acc;
  }, {});

  var HQ_COLOR       = '#3E68B2';
  var SERVICE_COLOR  = '#6E8FCB';
  var WAREHOUSE_COLOR = '#4B5563';
  var FUTURE_COLOR   = '#9CB3D4';

  function badgeSvg(color, label) {
    var inner = label
      ? '<text x="16" y="21" text-anchor="middle" font-size="14" font-weight="700" ' +
        'fill="#ffffff" font-family="-apple-system, Helvetica, Arial, sans-serif">' + label + '</text>'
      : '<circle cx="16" cy="16" r="4" fill="#ffffff"/>';
    return (
      '<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">' +
      '<circle cx="16" cy="16" r="13" fill="' + color + '" stroke="#ffffff" stroke-width="3"/>' +
      inner +
      '</svg>'
    );
  }

  var map = new mapboxgl.Map({
    container: 'pulse-map-container',
    style: 'mapbox://styles/mapbox/light-v11',
    center: [-96, 38],
    zoom: 3.7,
    pitchWithRotate: false,
    dragRotate: false,
    touchPitch: false,
    cooperativeGestures: true
  });

  map.touchZoomRotate.disableRotation();
  map.scrollZoom.disable();
  map.boxZoom.disable();
  map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-right');

  map.on('load', function () {
    // Markers don't depend on the state boundary fetch below, so add them
    // immediately — a slow/blocked CDN request shouldn't hide the pins.
    locations.forEach(function (loc) {
      var colorMap  = { hq: HQ_COLOR, service: SERVICE_COLOR, warehouse: WAREHOUSE_COLOR, future: FUTURE_COLOR };
      var labelMap  = { hq: 'P', service: null, warehouse: 'W', future: 'F' };

      var el = document.createElement('div');
      el.className = 'pulse-marker' + (loc.type === 'hq' ? ' hq-marker' : '');
      el.innerHTML = badgeSvg(colorMap[loc.type] || SERVICE_COLOR, labelMap[loc.type]);
      el.style.zIndex = zMap[loc.type] || '1';

      var popup = new mapboxgl.Popup({
        offset: 18,
        closeButton: false,
        closeOnClick: true,
        className: 'pulse-map-popup'
      }).setText(loc.city + ', ' + loc.state);

      new mapboxgl.Marker({ element: el, anchor: 'center' })
        .setLngLat([loc.lng, loc.lat])
        .setPopup(popup)
        .addTo(map);
    });

    fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json')
      .then(function (res) { return res.json(); })
      .then(function (topology) {
        var statesGeoJson = topojson.feature(topology, topology.objects.states);

        statesGeoJson.features = statesGeoJson.features.filter(function (feature) {
          return serviceAreaFips[Number(feature.id)];
        });

        map.addSource('pulse-service-area', {
          type: 'geojson',
          data: statesGeoJson
        });

        // Insert below the marker layer (markers are DOM elements, not a
        // GL layer, so this just keeps the fill/border under any future
        // GL layers and the base style's place labels).
        map.addLayer({
          id: 'pulse-service-area-fill',
          type: 'fill',
          source: 'pulse-service-area',
          paint: {
            'fill-color': '#8FA9D6',
            'fill-opacity': 0.45
          }
        });

        // Merge the filtered state geometries into one shape so the line
        // layer only traces the outer perimeter of the service area,
        // skipping the seams between adjacent highlighted states.
        var filteredGeometries = topology.objects.states.geometries.filter(function (geometry) {
          return serviceAreaFips[Number(geometry.id)];
        });
        var mergedBorder = topojson.merge(topology, filteredGeometries);

        map.addSource('pulse-service-area-outline', {
          type: 'geojson',
          data: { type: 'Feature', geometry: mergedBorder, properties: {} }
        });

        map.addLayer({
          id: 'pulse-service-area-border',
          type: 'line',
          source: 'pulse-service-area-outline',
          paint: {
            'line-color': '#3E68B2',
            'line-opacity': 0.8,

          }
        });
      })
      .catch(function (err) {

  });
})();
